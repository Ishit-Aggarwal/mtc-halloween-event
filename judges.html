<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0203">
  <meta name="color-scheme" content="dark">
  <title>Judges' Board</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%96%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Oswald:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/judges.css">
</head>
<body class="judges">
  <div class="atmo" aria-hidden="true">
    <div class="sky"></div>
    <div class="vignette"></div>
  </div>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Back to the wheel">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-text">Microsoft Tech Community<small>Amity Noida</small></span>
    </a>
    <div class="topbar-actions">
      <span class="crypt" id="crypt" data-state="connecting" role="status" hidden><i aria-hidden="true"></i><span id="cryptText">Summoning the crypt…</span></span>
      <button class="btn btn-ghost btn-sm" type="button" id="printBtn">Print</button>
    </div>
  </header>

  <main class="board">
    <header class="board-head">
      <p class="eyebrow">Round 2 · The Build</p>
      <h1 class="board-title">Judges' Board</h1>
      <p class="board-sub" id="boardSub">Every team's soul, curse, hex and twist — updated live.</p>
    </header>

    <div class="board-stats" id="stats"></div>

    <div class="board-tools">
      <input class="board-search" id="search" type="search" placeholder="Search teams, characters, curses…" autocomplete="off">
      <div class="chips" id="chips" role="group" aria-label="Filter teams">
        <button type="button" class="chip is-on" data-filter="all">All</button>
        <button type="button" class="chip" data-filter="spinning">Still spinning</button>
        <button type="button" class="chip" data-filter="waiting">Twist chained</button>
        <button type="button" class="chip" data-filter="done">Twist revealed</button>
      </div>
    </div>

    <div class="team-grid" id="grid" aria-live="polite"></div>
    <p class="board-empty" id="empty" hidden>No teams have signed the ledger yet.</p>
  </main>

  <!-- sealed until the secret team name is spoken on the main page (or here) -->
  <div class="judge-lock" id="judgeLock" hidden>
    <form class="judge-lock-box" id="judgeLockForm" autocomplete="off">
      <h2>The judges' door is sealed</h2>
      <p>Speak the secret name.</p>
      <input id="judgeLockInput" type="password" placeholder="Secret name" aria-label="Secret name">
      <button class="btn btn-blood" type="submit">Enter</button>
      <p class="judge-lock-err" id="judgeLockErr" role="alert"></p>
    </form>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/ledger.js"></script>
  <script src="js/judges.js"></script>
</body>
</html>
